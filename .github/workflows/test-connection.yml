name: Test Target URL Connectivity with Screenshot

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Browsers
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Capture Screenshot
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              // 伪装正常的 User-Agent，防止被防火墙直接拦截
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();
            console.log('Navigating to website...');
            
            try {
              // 1. 将等待条件改为 domcontentloaded（DOM树加载完毕即算成功）
              await page.goto('https://dashboard.digitalplat.org/', { 
                waitUntil: 'domcontentloaded', 
                timeout: 30000 
              });
              
              // 2. 额外等待 3 秒，让异步渲染和样式加载完成
              await page.waitForTimeout(3000);
              
              await page.screenshot({ path: 'screenshot.png', fullPage: true });
              console.log('Screenshot captured successfully!');
            } catch (err) {
              console.error('Navigation error:', err);
              // 即便报错也尝试强行截一张图，方便排查是否卡在验证码或错误页面
              await page.screenshot({ path: 'screenshot.png' });
              throw err;
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshot
          path: screenshot.png
