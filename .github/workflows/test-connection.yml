name: Test Target URL Connectivity with Proxy

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install playwright-extra puppeteer-extra-plugin-stealth playwright
          npx playwright install chromium --with-deps

      - name: Create and Run Script
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          # 动态写入 capture.js，彻底规避双引号冲突和文件丢失问题
          cat << 'EOF' > capture.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();
          chromium.use(stealth);

          (async () => {
            const proxyConfig = process.env.PROXY_SERVER ? {
              server: 'jz.hndz.qzz.io',
              username: 'yxl',
              password: '19873'
            } : undefined;

            console.log(proxyConfig ? 'Using residential proxy...' : 'No proxy provided, running directly...');

            const browser = await chromium.launch({
              headless: true,
              proxy: proxyConfig,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-blink-features=AutomationControlled'
              ]
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 720 },
              locale: 'en-US'
            });

            const page = await context.newPage();

            try {
              console.log('Navigating to target...');
              await page.goto('https://dashboard.digitalplat.org/', { 
                waitUntil: 'domcontentloaded', 
                timeout: 60000 
              });

              console.log('Waiting for Cloudflare verification to process...');
              for (let i = 0; i < 10; i++) {
                await page.waitForTimeout(2000);
                for (const frame of page.frames()) {
                  if (frame.url().includes('cloudflare') || frame.url().includes('turnstile')) {
                    const checkbox = await frame.$('input[type="checkbox"], .mark');
                    if (checkbox) {
                      console.log('Found Cloudflare checkbox, clicking...');
                      await checkbox.click();
                    }
                  }
                }
              }

              await page.waitForTimeout(3000);
              await page.screenshot({ path: 'screenshot.png', fullPage: true });
              console.log('Screenshot saved successfully!');
            } catch (err) {
              console.error('Execution encountered an error:', err);
              await page.screenshot({ path: 'screenshot.png' });
            } finally {
              await browser.close();
            }
          })();
          EOF

          # 执行刚刚生成的 Node 脚本
          node capture.js

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshot
          path: screenshot.png
